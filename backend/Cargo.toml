[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/proxy",
    "crates/providers",
    "crates/gateway",
    "crates/admin",
    "crates/tesie",
]
default-members = ["crates/tesie"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tesie"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }

tesie-core = { path = "crates/core" }
tesie-store = { path = "crates/store" }
tesie-proxy = { path = "crates/proxy" }
tesie-providers = { path = "crates/providers" }
tesie-gateway = { path = "crates/gateway" }
tesie-admin = { path = "crates/admin" }
